name: vector_meme
desc: 基于向量检索的 AstrBot 智能表情包插件。LLM 输出 %%tag%% 情绪占位符，插件结合 CLIP/OpenCLIP 向量相似度、tag 加权、反重复和随机采样选择具体图片；支持被 XML 结构化输出插件经 <sticker> 标记转发调用。可独立运行，不依赖 meme_manager。
help: |
  智能表情包 vector_meme

  基础命令（触发词：表情向量 / vmem / vm）：
    注：预热、索引、重建、诊断、修复、自动分类、重标注、评测、caption、删除、去重、刷新提示 等管理命令仅管理员可用；
        普通成员使用 搜索、解释 前需由管理员先 /vm 预热。
    表情向量 状态                             - 查看索引状态
    表情向量 预热                             - 预加载 embedder，检查模型可用性
    表情向量 索引 [目录]                      - 扫描目录并增量建立索引
    表情向量 重建                             - 清空并重建整个索引
    表情向量 列表 [标签]                      - 列出指定标签下的表情或整体统计
    表情向量 标签                             - 列出所有已注册标签
    表情向量 搜索 <文本> [--tag <标签>]       - 用文本搜索最匹配的表情
    表情向量 删除 <id>                        - 从索引中移除某条
    表情向量 去重 [preview/apply/undo] [阈值] - 检测/禁用近重复表情变体（每组保留 1 张）
    表情向量 帮助                             - 显示命令列表

  诊断与维护：
    表情向量 解释 <文本> [--tag <标签>] - 查看选图原因和打分细节
    表情向量 最近使用 [数量]            - 查看最近发送过的表情
    表情向量 诊断 [--deep]              - 检查 DB / FAISS / 文件系统一致性
    表情向量 修复                       - 清理缺失文件、补注册 tag、压缩孤儿向量、裁剪日志、刷新 prompt
    表情向量 刷新提示                   - 重新注入表情标签 prompt 到全局人格

  分类与治理：
    表情向量 自动分类 <id> [apply] - 基于 prototype + KNN 预测标签
    表情向量 重标注 <id> <新tag>   - 手动修改数据库主 tag，不移动文件
    表情向量 评测 <eval.json>      - 跑小型分类评测集
    表情向量 标签规范              - 查看 `tag_schema.json` 标签说明
    表情向量 caption [limit]       - 为无 caption 的表情批量生成视觉语义描述
    表情向量 caption 导出          - 把 DB 中的 caption 导出到 memes/captions.json

  LLM 集成：
    在回复中输出 %%happy%% 这类占位符，插件会移除占位符并追加匹配图片。
    配合 XML 结构化输出插件时，也可输出 <sticker>happy</sticker> 标记，
    由 XML 插件经 search_sticker_for_external() 转发取图。
    默认不使用 &&tag&&，避免和 meme_manager 冲突。
version: 0.8.7
author: chiriu & 橘雪莉
repo: https://github.com/kazamisama/astrbot_plugin_vector_meme/tree/main
