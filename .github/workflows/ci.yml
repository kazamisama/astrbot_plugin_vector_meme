name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-dev.txt

      - name: Docs drift check
        run: python scripts/gen_command_docs.py --check

      - name: Syntax check
        run: python -m compileall -q main.py core tests scripts

      - name: Tests with coverage
        run: |
          python -m coverage run --source=. --omit="tests/*,scripts/*,.venv/*,.venv-test/*,.cache/*" -m pytest tests -q
          python -m coverage report --fail-under=55
